{%- set is_sync = values.state_machine_type == 'EXPRESS' -%}
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ${{ values.component_name }}

  ${{ values.component_description }}


Parameters:
  Domain:
    Type: String
    Description: 'Name of Domain'

  System:
    Type: String
    Description: "Name of System"

  Component:
    Type: String
    Description: "Name of Component"

  CodeBranch:
    Type: String
    Description: "Name of GitHub Branch"

  Hostname:
    Type: String
    Description: Site FQDN

  DnsZoneId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Route53 Hosted Zone ID

  CognitoUserPoolArn:
    Type: String
    Description: Cognito User Pool ARN
{%- if values.log_level %}

  StateMachineLogRetentionInDays:
    Type: Number
    Description: "Number of days to retain state machine logs"
    Default: 30
{%- endif %}


Resources:
  ########
  # Step Functions
  ########
  ${{ values.state_machine_name }}StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: ${{ values.state_machine_type }}
      DefinitionUri: ./statemachine/${{ values.state_machine_name }}.asl.yaml
      DefinitionSubstitutions:
        Domain: !Ref Domain
        System: !Ref System
        Component: !Ref Component
        CodeBranch: !Ref CodeBranch
{%- if values.log_level %}
      Logging:
        Level: ${{ values.log_level }}
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ${{ values.state_machine_name }}StateMachineLogGroup.Arn
{%- endif %}
{%- if values.enable_tracing %}
      Tracing:
        Enabled: true
{%- endif %}
{%- if values.log_level or values.enable_tracing %}
      # NOTE: Add policies here for any AWS services the state machine calls.
      # See: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
      Policies:
{%- if values.log_level %}
        # Log delivery actions do not support resource-level permissions.
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'
{%- endif %}
{%- if values.enable_tracing %}
        - AWSXrayWriteOnlyAccess
{%- endif %}
{%- else %}
      # NOTE: Add policies here for any AWS services the state machine calls.
      # See: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
      #Policies:
      #  - LambdaInvokePolicy:
      #      FunctionName: !Ref MyFunction
{%- endif %}
{%- if values.log_level %}

  ${{ values.state_machine_name }}StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # The /aws/vendedlogs/ prefix avoids CloudWatch Logs resource policy size limits.
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-${{ values.state_machine_name }}
      RetentionInDays: !Ref StateMachineLogRetentionInDays
{%- endif %}


  ########
  # API Gateway
  ########
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Hostname
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Hostname
          HostedZoneId: !Ref DnsZoneId

  # Role API Gateway uses to start state machine executions.
  RestApiIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ${{ 'states:StartSyncExecution' if is_sync else 'states:StartExecution' }}
                Resource: !Ref ${{ values.state_machine_name }}StateMachine

  RestApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/api-gateway/${AWS::StackName}"
      RetentionInDays: 7

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref CodeBranch
      Domain:
        DomainName: !Ref Hostname
        CertificateArn: !Ref SiteCertificate
        Route53:
          HostedZoneId: !Ref DnsZoneId
        EndpointConfiguration: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt RestApiLogGroup.Arn
        Format: '$context.extendedRequestId $context.identity.sourceIp $context.identity.caller $context.identity.user [$context.requestTime] "$context.httpMethod $context.resourcePath $context.protocol" $context.status $context.responseLength $context.requestId'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false
      DefinitionBody:
        Fn::Transform:
          Name: "AWS::Include"
          Parameters:
            Location: "openapi.yaml"


  # SSM Values
  ${{ values.state_machine_name }}StateMachineArnSsmParam:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Description: ARN of ${{ values.state_machine_name }} state machine
      Name: !Sub /${Domain}/${System}/${Component}/${CodeBranch}/${{ values.state_machine_name }}StateMachineArn
      Value: !Ref ${{ values.state_machine_name }}StateMachine

  ${{ values.state_machine_name }}StateMachineNameSsmParam:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Description: Name of ${{ values.state_machine_name }} state machine
      Name: !Sub /${Domain}/${System}/${Component}/${CodeBranch}/${{ values.state_machine_name }}StateMachineName
      Value: !GetAtt ${{ values.state_machine_name }}StateMachine.Name


Outputs:
  ${{ values.state_machine_name }}StateMachineArn:
    Description: ARN of ${{ values.state_machine_name }} state machine
    Value: !Ref ${{ values.state_machine_name }}StateMachine

  ${{ values.state_machine_name }}StateMachineName:
    Description: Name of ${{ values.state_machine_name }} state machine
    Value: !GetAtt ${{ values.state_machine_name }}StateMachine.Name

  ApiEndpoint:
    Description: URL of the endpoint that starts the state machine
    Value: !Sub https://${Hostname}${{ values.url_path_prefix }}/${{ values.resource_name }}
